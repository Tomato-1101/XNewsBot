# XNewsBot 配信ジャンル定義
#
# このファイルを編集すると、収集対象ジャンルと X 検索キーワードが変わります。
# - [[genre]] ブロック1つが1ジャンル。ファイル内の並び順がそのまま表示順になります。
# - key       : ジャンル識別子(LINEのボタン表示・DBに使用)。重複不可・必須。
# - label     : 任意。LINE表示名(省略時は key を表示)。key を変えずに表示名だけ変えたいとき用。
# - keywords  : X検索キーワード。収集時に "(kw1 OR kw2 ...)" の OR 検索になります。
# - lang      : 任意(既定 "ja")。"ja"=日本語のみ。"any"=言語指定なし(英語の一次情報も拾う)。
#               海外の速報を、日本語で言及されるのを待たずに取得したいジャンルは "any" にし、
#               英語キーワードも併記します。見出し・要約はキュレーション側が日本語にします。
# - exclude   : 任意。この語を含む投稿を除外(AI/暗号資産のスパム対策など)。省略可。
# - min_faves : 任意。このジャンルだけ最低いいね数を上書き(ニッチは下げ、特大は上げる)。省略可。
#               ※いいね下限を満たさなくても表示回数が多い速報は採用します(config の collect_min_views_floor)。
# - selectable: 任意(既定 true)。false にするとオンボーディングの選択肢に出さず、
#               全員に常時収集・常時配信する「常時ジャンル」になる(例: 特大ニュース)。
# - note      : 任意のメモ(動作には影響しません)。
#
# 変更後はキュレーションの定期実行(または scripts/pipeline.py collect)から反映されます。
# 文字コードは UTF-8。日本語キーワード可。並び順は配信時の表示順(先頭ほど上に出る)。
#
# ★各ジャンルは「日本だけでなく世界のニュースも」拾うよう、海外・国際系のキーワードを併記しています。
#   グローバル系(特大/AI/株/テクノロジー)は lang="any" にして英語の一次情報も直接拾います。
#   他ジャンルも世界の速報を速く拾いたい場合は、同様に lang="any" と英語キーワードを足してください。
#
# ※2026-08-10 読者の関心に合わせ「政治」「経済」「世界情勢」を廃止(AI/テクノロジー/株/RPA 中心へ)。
#   金融政策・為替など市場に直結するマクロ要因は「株」ジャンルが吸収。

[[genre]]
key = "特大"
selectable = false
min_faves = 300
lang = "any"
note = "ジャンル横断の特大ニュース。選択ジャンルに関わらず常に収集。本当に速報級・大事件のときだけ出す(無ければ0件)。英語の一次速報も拾う。"
keywords = [
  "速報", "ニュース速報", "緊急", "号外", "会見", "発表",
  "地震", "事故", "死去", "選挙", "国際", "世界",
  "breaking", "BREAKING", "breaking news", "just in", "live updates",
]

[[genre]]
key = "AI"
lang = "any"
note = "最新のAIニュース・プロダクト・研究・開発ツール(国内/海外問わず)。読者の最重要ジャンルで厚めに拾う。株/投資の宣伝が混ざりやすいので exclude で除外。"
keywords = [
  "生成AI", "ChatGPT", "OpenAI", "Claude", "Anthropic", "Gemini",
  "LLM", "AIエージェント", "Copilot", "AI開発",
  "AI規制", "海外AI", "NVIDIA", "シリコンバレー",
  "GPT-5", "frontier model", "AI safety", "open source LLM",
  "Claude Code", "Cursor", "AIコーディング", "DeepSeek", "Grok",
]
exclude = ["必ず買い", "銘柄", "株主優待", "100株", "上場来高値"]

[[genre]]
key = "株"
lang = "any"
note = "国内株+米国・世界の株式市場。金融政策・為替など市場に直結するマクロ要因もここで拾う(旧「経済」を統合 2026-08-10)。英語の一次情報(決算速報・市況)も拾う。"
keywords = [
  "株価", "日経平均", "決算", "米株", "S&P500", "半導体株",
  "東証", "個別株", "新NISA", "グロース株",
  "NYダウ", "ナスダック", "米国株", "中国株", "世界同時株安",
  "日銀", "FRB", "金利", "為替", "円安",
  "stock market", "earnings", "Nasdaq", "S&P 500", "Wall Street",
]

[[genre]]
key = "テクノロジー"
lang = "any"
note = "AI以外の技術全般(スマホ/半導体/宇宙開発/EV/ロボット/セキュリティ等)。英語の一次情報も拾う。"
keywords = [
  "テクノロジー", "IT", "スマホ", "iPhone", "半導体", "宇宙開発",
  "ロケット", "EV", "サイバーセキュリティ", "ガジェット", "量子コンピュータ",
  "ヒューマノイド", "ロボット", "SpaceX", "robotics", "quantum computing",
]
exclude = ["必ず買い", "銘柄"]

[[genre]]
key = "RPA"
note = "RPA・業務自動化・DXの最新情報＋エンジニア/現場の声(海外ベンダー含む)。ニッチで高いいねが付きにくいので min_faves を下げる。"
min_faves = 10
keywords = [
  "RPA", "UiPath", "Power Automate", "WinActor", "業務自動化",
  "RPAエンジニア", "Automation Anywhere", "ノーコード", "自動化ツール",
  "DX", "業務効率化", "海外DX",
]

[[genre]]
key = "ビジネス"
note = "企業・起業・業界動向(国内/海外スタートアップ含む)。"
keywords = [
  "ビジネス", "スタートアップ", "起業", "経営", "M&A", "業界動向",
  "上場", "資金調達", "新規事業", "海外スタートアップ",
]

[[genre]]
key = "健康"
note = "医療・健康・ヘルスケア。WHO 等の世界的トピックも。"
keywords = [
  "健康", "医療", "病気", "新薬", "ワクチン", "感染症",
  "メンタルヘルス", "睡眠", "栄養", "WHO", "ダイエット",
]

[[genre]]
key = "暗号資産"
note = "暗号資産・Web3。値動きより業界・規制ニュース寄り(海外取引所・規制も)。スパムが多いので exclude を厚めに。"
keywords = [
  "ビットコイン", "イーサリアム", "暗号資産", "仮想通貨", "Web3",
  "NFT", "ブロックチェーン", "ステーブルコイン", "暗号資産規制",
]
exclude = ["必ず儲かる", "稼げる", "LINE登録", "無料配布", "プレゼント企画", "エアドロ"]
