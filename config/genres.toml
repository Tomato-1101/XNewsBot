# XNewsBot 配信ジャンル定義
#
# このファイルを編集すると、収集対象ジャンルと X 検索キーワード・直取り RSS が変わります。
# - [[genre]] ブロック1つが1ジャンル。ファイル内の並び順がそのまま表示順になります。
# - key       : ジャンル識別子(LINEのボタン表示・DBに使用)。重複不可・必須。
# - label     : 任意。LINE表示名(省略時は key を表示)。key を変えずに表示名だけ変えたいとき用。
# - keywords  : 日本語の X 検索キーワード。"(kw1 OR kw2 ...) lang:ja" の OR 検索になります。
#               Google ニュース(日本語)の検索にも先頭数語を使います。
#               ★曖昧語は入れない(「IT」は英語の it に、「DX」は無関係語に、単独の「Copilot」は操縦士に一致した)。
# - keywords_en: 任意。英語の X 検索キーワード("... lang:en" の別クエリ。いいね下限は日本語より高い)。
#               Google ニュース(英語・米国)の検索にも先頭数語を使います。空なら英語は集めない。
# - accounts  : 任意。公式・一次情報の X ハンドル(@ なし)。"(from:A OR from:B ...)" で直近24hを
#               いいね下限なしで集め、候補の先頭に置く(official=true)。
# - feeds     : 任意。直取り RSS/Atom/RDF。{ url, name, filter } の配列。
#               filter=true は keywords/keywords_en のどれかを見出し・概要に含む項目だけ採用(総合媒体用)。
# - x_queries : 任意。キーワードを使わない X の生クエリ。{ query, max, min_faves } の配列。
#               query に直近の窓(within_time)を足して投げ、いいね下限 min_faves はクライアント側でも
#               確定的に効かせる(例: 話題の「いいねが極端に多い日本語の投稿」)。max は取得上限(管理UIの上限も効く)。
# - trend_sources: 任意。急上昇ワード・人気エントリーの取得元(xnewsbot/trends.py)の名前の配列。
#               "yahoo_realtime"(Yahoo!リアルタイム検索のトレンド語 → Google ニュースの見出し) /
#               "google_trends"(Google トレンド急上昇・関連ニュースつき) / "hatena"(はてブ人気エントリー)。
# - news_max  : 任意。ニュース候補(Google ニュース+feeds+trend_sources を重複除去した後)の上限。省略時は 40。
# - exclude   : 任意。この語を含む投稿を除外(スパム・別話題対策)。
# - exclude_accounts: 任意。使い回し・煽り系アカウントの denylist(@ なし・大文字小文字は無視)。
# - min_faves : 任意。日本語クエリの最低いいね数(ニッチは下げ、特大は上げる)。省略時は設定の既定値。
#               ※いいね下限を満たさなくても表示回数が多い速報は採用します(config の collect_min_views_floor)。
# - min_faves_en: 任意。英語クエリの最低いいね数(省略時は max(min_faves, 500))。
# - selectable: 任意(既定 true)。false にするとオンボーディングの選択肢に出さず、
#               全員に常時収集・常時配信する「常時ジャンル」になる(例: 特大ニュース)。
# - note      : 任意のメモ(動作には影響しません)。
# - lang      : 廃止(2026-10-01)。英語は keywords_en の別クエリで集めるため不要。書いても無視されます。
#
# 変更後はキュレーションの定期実行(または scripts/pipeline.py collect)から反映されます。
# 文字コードは UTF-8。並び順は配信時の表示順(先頭ほど上に出る)。
#
# ※2026-08-10 読者の関心に合わせ「政治」「経済」「世界情勢」を廃止(AI/テクノロジー/株中心へ)。
#   金融政策・為替など市場に直結するマクロ要因は「株」ジャンルが吸収。
# ※2026-10-01 「RPA」を廃止(本人の決定)。取得を「日本語/英語/公式アカウント」の3クエリ＋直取り RSS に刷新。
# ※2026-10-01 「話題」を追加し、「暗号資産」の表示名を「仮想通貨」に。並びを 特大/AI/株/仮想通貨/テクノロジー/話題/他 に変更。

[[genre]]
key = "特大"
selectable = false
min_faves = 300
min_faves_en = 3000
note = "ジャンル横断の特大ニュース。選択ジャンルに関わらず常に収集。本当に速報級・大事件のときだけ出す(無ければ0件)。芸能・スポーツの速報は exclude で落とす。"
keywords = [
  "ニュース速報", "号外", "緊急地震速報", "震度5強", "震度6弱", "震度6強", "震度7", "大地震", "津波", "噴火",
  "特別警報", "死去", "訃報", "首相", "総選挙", "辞任表明",
  "テロ", "墜落", "脱線", "大規模停電", "緊急事態宣言",
]
# 「BREAKING」「breaking news」「just in」「earthquake」は外した(スポーツ速報・小さな地震・
# 「Late-Breaking」などに一致して特大の英語候補の大半がノイズだった。2026-10-01 試走で確認)。
# 英語の速報は accounts の Reuters/AP/BBCBreaking と Google News(US) のトップで拾う。
keywords_en = [
  "tsunami", "major earthquake", "plane crash", "assassinated",
  "state of emergency", "martial law", "coup",
]
exclude = ["スタメン", "試合速報", "号ホームラン", "本塁打", "熱愛", "主演", "ガチャ", "プレゼント企画",
           "選手", "球団", "ドラフト", "試合"]
accounts = ["nhk_news", "Reuters", "AP", "BBCBreaking", "kyodo_official", "jijicom"]
exclude_accounts = [
  "WhaleNewsDaily", "DeepLeaksHQ", "nicksortor", "MarioNawfal", "Breaking911",
  "visegrad24", "DiscloseTV", "PopBase", "PopCrave", "dom_lucre", "AutismCapital",
  "Osint613", "TheBabylonBee", "BRICSinfo", "WatcherGuru", "unusual_whales",
  "Polymarket", "Kalshi",
  # スポーツ速報(「BREAKING」「訃報」で一致していた。2026-10-01 試走で 特大 X 一般の大半)
  "FabrizioRomano", "TouchlineX", "433", "SkySportsNews", "gnomotoke",
]
feeds = [
  { url = "https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja", name = "Google ニュース(日本)" },
  { url = "https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en", name = "Google News(US)" },
]

[[genre]]
key = "AI"
