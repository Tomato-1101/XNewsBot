# XNewsBot 配信ジャンル定義
#
# このファイルを編集すると、収集対象ジャンルと X 検索キーワードが変わります。
# - [[genre]] ブロック1つが1ジャンル。ファイル内の並び順がそのまま表示順になります。
# - key       : ジャンル識別子(LINEのボタン表示・DBに使用)。重複不可・必須。
# - keywords  : X検索キーワード。収集時に "(kw1 OR kw2 ...) lang:ja" の OR 検索になります。
# - exclude   : 任意。この語を含む投稿を除外(AIジャンルの株スパム対策など)。省略可。
# - min_faves : 任意。このジャンルだけ最低いいね数を上書き(ニッチは下げ、特大は上げる)。省略可。
# - selectable: 任意(既定 true)。false にするとオンボーディングの選択肢に出さず、
#               全員に常時収集・常時配信する「常時ジャンル」になる(例: 特大ニュース)。
# - note      : 任意のメモ(動作には影響しません)。
#
# 変更後はキュレーションの定期実行(または scripts/pipeline.py collect)から反映されます。
# 文字コードは UTF-8。日本語キーワード可。並び順は配信時の表示順(先頭ほど上に出る)。

[[genre]]
key = "特大"
selectable = false
min_faves = 300
note = "ジャンル横断の特大ニュース。選択ジャンルに関わらず常に収集し、配信のたびに必ず先頭へ1枠出す。いいね下限を高くして本当に話題のものだけに絞る。"
keywords = [
  "速報", "ニュース速報", "緊急", "号外", "会見", "発表",
  "地震", "事故", "死去", "選挙", "国際", "世界",
]

[[genre]]
key = "AI"
note = "最新のAIニュース・プロダクト・研究。株/投資の宣伝が混ざりやすいので exclude で除外。"
keywords = [
  "生成AI", "ChatGPT", "OpenAI", "Claude", "Anthropic", "Gemini",
  "LLM", "AIエージェント", "Copilot", "AI開発",
]
exclude = ["必ず買い", "銘柄", "株主優待", "100株", "上場来高値"]

[[genre]]
key = "株"
keywords = [
  "株価", "日経平均", "決算", "米株", "S&P500", "半導体株",
  "東証", "個別株", "新NISA", "グロース株",
]

[[genre]]
key = "経済"
keywords = [
  "経済", "円安", "円高", "為替", "金利", "インフレ",
  "日銀", "FRB", "GDP", "景気",
]

[[genre]]
key = "政治"
keywords = [
  "政治", "選挙", "国会", "法案", "首相", "内閣",
  "外交", "増税", "政策", "与党",
]

[[genre]]
key = "RPA"
note = "RPA・業務自動化の最新情報＋エンジニア/現場の声。ニッチで高いいねが付きにくいので min_faves を下げる。"
min_faves = 10
keywords = [
  "RPA", "UiPath", "Power Automate", "WinActor", "業務自動化",
  "RPAエンジニア", "Automation Anywhere", "ノーコード", "自動化ツール",
]

[[genre]]
key = "世界"
note = "世界情勢・海外の速報・国際的なビッグニュース。"
keywords = [
  "世界情勢", "国際情勢", "海外ニュース", "ウクライナ", "中東", "ガザ",
  "イスラエル", "中国情勢", "トランプ", "国連",
]
